baseURL = "http://127.0.0.1:1313/"
locale = "zh-hans"
defaultContentLanguage = "zh-hans"
hasCJKLanguage = true
title = "AskCloud Tech Blog"
enableRobotsTXT = true
enableEmoji = true

[languages]
  [languages.zh-hans]
    label = "简体中文"
    locale = "zh-hans"
    weight = 1

  [languages.en]
    label = "English"
    locale = "en-US"
    title = "AskCloud Tech Blog"
    weight = 2
    [languages.en.params]
      description = "English content is coming soon."

[pagination]
  pagerSize = 18

[outputs]
  home = ["HTML", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = false
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 2

[module]
  [[module.imports]]
    path = "github.com/mrhelloboy/seven"
  [module.hugoVersion]
    extended = false
    min = "0.128.0"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/watching/hugo_stats.json"

[build]
  noJSConfigInAssets = true
  writeStats = true
  [[build.cachebusters]]
    source = "assets/watching/hugo_stats\\.json"
    target = "styles\\.css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"

[params]
  description = "OSCP 实战、安全总结、读书随笔与工具汇总"
  omitCategoryOnMenu = true
  categoryName = "分类"

  [params.app]
    title = "AskCloud Tech Blog"
    themeColor = "#ffffff"

  [params.logo]
    img = "/images/branding/pic-banner1.jpg"
    img_dark = "/images/branding/pic-banner1.jpg"
    customLogoHeight = "56"
    customLogoWidth = "56"
    text = ""

  [params.home]
    showContentTypes = ["posts", "hackthebox", "pg", "vulnlab"]

  [params.follow.email]
    enable = false
    url = ""
  [params.follow.github]
    enable = true
    url = ""
  [params.follow.x]
    enable = false
    url = ""
  [params.follow.wechat]
    enable = true
    QRCodeUrl = ""

  [params.copyright]
    owner = ""
    startYear = "2026"

  [params.articleMeta]
    disableImgGradient = true
    enablePageView = true

  [params.assets]
    baseURL = ""

  [params.comment]
    enable = true
    enableCounts = false
    [params.comment.waline]
      enable = false
      serverURL = ""
      lang = "zh-CN"
      reaction = false
      search = false
    [params.comment.twikoo]
      enable = false
      envID = ""
      path = ""
      lang = "zh-CN"
      region = ""
    [params.comment.giscus]
      enable = true
      repo = ""
      repoID = ""
      category = ""
      categoryID = ""
      mapping = "pathname"
      strict = "0"
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "top"
      theme = "preferred_color_scheme"
      lang = "zh-CN"
      loading = "lazy"

  [params.search]
    enable = true

  [params.analytics.goatcounter]
    enable = false
    code = ""

