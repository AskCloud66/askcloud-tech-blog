    aria-label="GitHub account">
    <svg
      class="size-4"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      fill="currentColor"
      viewBox="0 0 20 20">

        clip-rule="evenodd" />
    </svg>
  </a>
{{ else if $github.enable }}
  <span
    class="site-footer-icon is-static text-gray-600 dark:text-gray-400"
    aria-label="GitHub icon placeholder">
    <svg
      class="size-4"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      fill="currentColor"
      viewBox="0 0 20 20">

        clip-rule="evenodd" />
    </svg>
  </span>

      type="button"

      aria-label="WeChat QRCode">
      <svg
        class="size-4"
        viewBox="0 0 1184 1024"

          p-id="1496"></path>
      </svg>
    </button>
    <div
      x-show="openQC"
      x-transition:leave="ease-in duration-500"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      @keydown.window.escape="openQC = false; document.body.style.overflow = ''; window.scrollTo(0, scrollY);"
      x-cloak
      role="dialog"
      aria-modal="true">
      <div class="fixed inset-0 z-50 bg-gray-900/85 backdrop-blur-md transition-opacity"></div>
      <div class="fixed inset-0 z-50 w-full">
        <div class="mx-auto flex h-full w-full items-center justify-center">
          <img
            @click.away="openQC = false; document.body.style.overflow = ''; window.scrollTo(0, scrollY);"
            class="object-cover"
            x-transition:leave="ease-in duration-500"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            :class="openQC ? 'animate-scaleInCenter' : 'animate-scaleOutCenter'"
            src="{{ $wechat.QRCodeUrl }}"
            alt="WeChat QRCode" />
        </div>
      </div>
    </div>
  </div>

  <span

    <svg
